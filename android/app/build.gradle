import groovy.json.JsonSlurper

plugins {
    // Exports the libraries the release packages, with their licenses, for the About page (`bun run
    // update-android-licenses`): it adds a task and nothing to the build.
    id "com.mikepenz.aboutlibraries.plugin" version "15.3.0"
}

apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // The project is the repository's root; the entry is the app's, for Android.
    root = file("../../")
    reactNativeDir = file("../../node_modules/react-native")
    codegenDir = file("../../node_modules/@react-native/codegen")
    cliFile = file("../../node_modules/react-native/cli.js")
    entryFile = file("../../src/entrypoints/native.ts")
    // Every variant embeds its bundle, compiled by hermesc: a debug build runs without Metro's server, as a release
    // does.
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

// The version is package.json's, YEAR.MONTH.N (the `android-release` skill): the code orders the releases.
def appVersion = new JsonSlurper().parse(rootProject.file('../package.json')).version
def appVersionParts = appVersion =~ /^(\d{4})\.(1[0-2]|[1-9])\.(\d|[1-9]\d)$/
if (!appVersionParts.matches()) {
    throw new GradleException("package.json's version ${appVersion} is not YEAR.MONTH.N, with N below 100")
}
def (appYear, appMonth, appRelease) = (1..3).collect { appVersionParts.group(it).toInteger() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "net.gaudo.fridgy"
    defaultConfig {
        applicationId "net.gaudo.fridgy"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appYear * 10000 + appMonth * 100 + appRelease
        versionName appVersion
    }
    signingConfigs {
        // React Native's public key, for builds that never leave the machine.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        // Unsigned: the release is signed with the upload key, which never enters the repository.
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// Fresco depends on Bolts' tasks 1.4.0, under BSD with Facebook's PATENTS: the same code, under MIT, replaces it
// (`../bolts-tasks/build.gradle`).
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute(module("com.parse.bolts:bolts-tasks")).using(project(":bolts-tasks"))
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}
