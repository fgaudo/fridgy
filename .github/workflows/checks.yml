name: Checks

on:
  push:
  pull_request:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # React Native's command line, which `bun run bundle` calls, runs on Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint
      - run: bunx dprint check
      # What Gradle makes of the JavaScript, without Android's toolchain: Metro's bundle, and Hermes' bytecode of it.
      # A module Metro cannot resolve, or a syntax Hermes rejects, fails here rather than on a phone.
      - run: bun run bundle
      - run: node_modules/hermes-compiler/hermesc/linux64-bin/hermesc -emit-binary -O -out out/index.android.hbc out/index.android.bundle
      # The packages the bundle ships: the command fails on a license the app may not ship with, and a difference
      # means the committed list is stale. The Android libraries need Gradle, and are checked before a release.
      - run: bun run update-licenses
      - name: Licenses up to date
        run: git diff --exit-code -- src/app/children/about/services/licenses/licenses.npm.generated.json
