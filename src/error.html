<!DOCTYPE html>
<!--
  Capacitor's `server.errorPath`: loaded instead of the app when the WebView is older than
  `android.minWebViewVersion`, or when the app's page fails to load. It runs on that old WebView,
  so it stays plain HTML, CSS and ES5.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
    /* The surface and on-surface of Fridgy's Material scheme (`scripts/palette.ts`), light and dark. */
    body {
      margin: 0;
      padding: 2rem 1.5rem;
      font-family: sans-serif;
      line-height: 1.5;
      color: #442900;
      background: #fff5ed;
    }
    @media (prefers-color-scheme: dark) {
      body {
        color: #ffe0bf;
        background: #180b00;
      }
    }
    </style>
  </head>
  <body>
    <h1>Fridgy cannot start</h1>
    <p>
      Fridgy needs a newer version of Android System WebView. Update it from the
      Play Store, then open Fridgy again.
    </p>
    <script>
    // The splash screen is hidden by the app once it has started, which here it never does.
    var plugins = window.Capacitor && window.Capacitor.Plugins
    if (plugins && plugins.SplashScreen) {
      plugins.SplashScreen.hide()
    }
    </script>
  </body>
</html>
